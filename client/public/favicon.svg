<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Navigation Left Facet (Safety Blue) -->
    <linearGradient id="navBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Navigation Right Facet (Alert Hazard Orange) -->
    <linearGradient id="navOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Radar Pulse Arc -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Radar Scan Circles / Safe Horizon Wave -->
  <path d="M 12 36 A 20 20 0 0 1 52 36" fill="none" stroke="url(#pulseGrad)" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.65" />
  <path d="M 18 36 A 14 14 0 0 1 46 36" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.4" />

  <!-- Navigation Compass Chevron (DisasterNav Core) -->
  <g filter="url(#glow)">
    <!-- Left Wing (Safe Corridor Navigation) -->
    <polygon points="32,10 16,46 32,38" fill="url(#navBlue)" />
    <!-- Right Wing (Hazard Avoidance Vector) -->
    <polygon points="32,10 32,38 48,46" fill="url(#navOrange)" />
    <!-- Center Spine Highlight -->
    <line x1="32" y1="10" x2="32" y2="38" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Beacon Pulse Indicator Dot at Summit -->
  <circle cx="32" cy="10" r="2.5" fill="#ffffff" />
  <circle cx="32" cy="10" r="4.5" fill="#38bdf8" opacity="0.4" />
</svg>